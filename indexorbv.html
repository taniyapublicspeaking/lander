<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vertical Axis Orb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="orb-background">
    <div class="orb" id="orb" aria-label="Public Speaking">
        <div class="orb-world">
            <div class="orb-surface"></div>
        </div>

        <div class="orb-text">
            <span>Public<br>Speaking</span>
        </div>

        <div class="orb-highlight"></div>
        <div class="orb-shadow"></div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
