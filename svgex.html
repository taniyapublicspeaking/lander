<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive SVG Container</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .svg-container {
      width: 100%;
      height: 180px;
      overflow: hidden;
      background: #0f172a;
    }

    .svg-container svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .content {
      padding: 2rem;
    }

    @media (max-width: 600px) {
      .svg-container {
        height: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="svg-container">
    <svg
      viewBox="0 0 1440 180"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563eb" />
          <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
      </defs>

      <rect width="1440" height="180" fill="url(#gradient)" />

      <path
        d="M0 120
           C240 50 360 170 600 100
           S960 40 1200 100
           S1350 140 1440 70
           V180 H0 Z"
        fill="rgba(255,255,255,0.12)"
      />
    </svg>
  </div>

  <main class="content">
    <h1>Page Content</h1>
    <p>The responsive SVG container stays at the top of the page.</p>
    <p>  The key parts are width: 100% on the container/SVG and preserveAspectRatio="none", which lets the SVG stretch responsively across the available width.  </p>
  </main>

</body>
</html>
