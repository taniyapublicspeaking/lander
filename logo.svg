<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 60"
  role="img"
  aria-labelledby="logoTitle"
>
  <title id="logoTitle">Company Logo</title>

  <!-- Logo icon -->
  <circle
    cx="30"
    cy="30"
    r="24"
    fill="#2563eb"
  />

  <path
    d="M18 30 L27 39 L44 21"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Logo text -->
  <text
    x="65"
    y="38"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#111827"
  >
    Brand
  </text>
</svg>
