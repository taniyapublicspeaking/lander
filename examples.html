<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Classes | Ages 11–13</title>
    <meta
        name="description"
        content="English classes for children aged 11–13. Build confidence, speak clearly and write creatively."
    >

    <!-- Main styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- SVG-specific styles -->
    <link rel="stylesheet" href="svgexample.css">
</head>

<body>


    <svg>
    <!-- Pulsating border -->
    <circle
        cx="205"
        cy="110"
        r="7"
        class="map-pin-pulse"
    />

    <!-- Main pin -->
    <circle
        cx="205"
        cy="110"
        r="7"
        class="map-pin-center"
    />
</svg>



<svg>
    <circle cx="205" cy="110" r="7" class="map-pin-pulse pulse-1" />
    <circle cx="205" cy="110" r="7" class="map-pin-pulse pulse-2" />

    <circle
        cx="205"
        cy="110"
        r="7"
        class="map-pin-center"
    />
</svg>


    

<span class="contact-icon">📱</span>

<span class="contact-icon">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" />
        <line x1="12" y1="18" x2="12.01" y2="18" />
    </svg>
</span>


    
</body>
</html>
