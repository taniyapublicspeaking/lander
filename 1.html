<html>
<head>

  <link rel="stylesheet" href="css/texttransitions.css">
</head>

<body>

        <section class="hero">

            <!-- Decorative SVG -->

            <!-- Decorative SVG LEFT SIDE-->
            <svg class="hero-decoration hero-decoration-left" viewBox="0 0 300 400" aria-hidden="true" >                 
                <circle cx="150" cy="80" r="35" class="svg-circle"/>                
                <circle cx="120" cy="180" r="18" class="svg-circle-small"/>
                <circle cx="280" cy="20" r="20" class="svg-circle-small"/>                 
                <path d="M20 280 C100 220 160 330 280 250" class="svg-line"/>                
                <path d="M40 330 C120 280 180 370 270 310" class="svg-line svg-line-secondary"/>             
            </svg>


            <!-- Decorative SVG RIGHT SIDE-->
            <svg class="hero-decoration hero-decoration-right" viewBox="0 0 300 400" aria-hidden="true">                                
                <circle cx="220" cy="180" r="55" class="svg-ring"/>
                <circle cx="150" cy="60" r="35" class="svg-ring-org"/>
                <circle cx="70" cy="40" r="20" class="svg-diamond-nonfill"/>                
                <path d="M60 300 Q150 220 250 310" class="svg-line"/>
                <path d="M60 300 Q150 220 250 310" class="svg-line-orange" transform="translate(10,10)"/>             
            </svg>

            <div class="container hero-content">

                <div class="hero-copy">

                    <p class="eyebrow">English Classes</p>

                    <h1>
                        Build Confidence.<br>
                        <span>Speak Clearly.</span><br>
                        Write Creatively.
                    </h1>

                    <p class="hero-age">
                        For Children Aged <strong>11–13</strong>
                    </p>

                    <p class="hero-description">
                        A specially designed English programme helping children
                        aged 11–13 develop essential communication, language
                        and presentation skills.
                    </p>

                    <a href="#registration" class="btn btn-primary">
                        Register Now
                        <span aria-hidden="true">→</span>
                    </a>

                </div>

                <div class="hero-visual">

                    <div class="hero-card">

                        <!-- Main SVG illustration -->
                        <svg
                            class="hero-illustration"
                            viewBox="0 0 500 500"
                            role="img"
                            aria-label="Illustration representing confident communication"
                        >
                            <circle
                                cx="250"
                                cy="250"
                                r="210"
                                class="svg-bg-circle"
                            />
    <!-- Point 1 -->
    <g class="svg-point point-1">
        <text x="250" y="220" class="point-title">
            Public Speaking
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Build confidence, improve voice
            </tspan>
            <tspan x="250" dy="25">
                projection, body language and
            </tspan>
            <tspan x="250" dy="25">
                presentation skills.
            </tspan>
        </text>
    </g>

    <!-- Point 2 -->
    <g class="svg-point point-2">
        <text x="250" y="220" class="point-title">
            Creative Writing
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Develop imaginative ideas,
            </tspan>
            <tspan x="250" dy="25">
                create engaging stories and
            </tspan>
            <tspan x="250" dy="25">
                write with expression.
            </tspan>
        </text>
    </g>

    <!-- Point 3 -->
    <g class="svg-point point-3">
        <text x="250" y="220" class="point-title">
            Grammar
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Strengthen grammar, vocabulary
            </tspan>
            <tspan x="250" dy="25">
                and sentence construction for
            </tspan>
            <tspan x="250" dy="25">
                more accurate communication.
            </tspan>
        </text>
    </g>

    <!-- Point 4 -->
    <g class="svg-point point-4">
        <text x="250" y="220" class="point-title">
            Spoken English
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Improve speaking skills to
            </tspan>
            <tspan x="250" dy="25">
                communicate with greater
            </tspan>
            <tspan x="250" dy="25">
                confidence, ease and clarity.
            </tspan>
        </text>
    </g>                           
                            
                        </svg>
                    </div>
                </div>
            </div>
        </section>
                          
  
</body>
</html>
