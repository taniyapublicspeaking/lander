<header class="site-header">
    <div class="container header-inner">

        <a href="#" class="logo" aria-label="English Classes Home">
            ENGLISH<span>CLASSES</span>
        </a>

        <nav class="main-nav" id="mainNav" aria-label="Main navigation">
            <a href="#learn">What Your Child Will Learn</a>
            <a href="#programme">Why This Programme?</a>
            <a href="#educator">Meet The Educator</a>
            <a href="#contact">Contact Us</a>
        </nav>

        <a href="#registration" class="btn btn-small">
            Register Now
        </a>

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mainNav"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>
</header>

<style>
/* =========================
   FLOATING HEADER
========================= */

.site-header {
    position: fixed;
    top: 18px;
    left: 0;
    width: 100%;
    z-index: 1000;
    padding: 0 20px;
}

.header-inner {
    width: min(1200px, 100%);
    min-height: 72px;
    margin: 0 auto;

    display: flex;
    align-items: center;
    gap: 30px;

    padding: 12px 18px 12px 24px;

    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    transition:
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
}

/* Slightly stronger glass effect after scrolling */
.site-header.scrolled .header-inner {
    background: rgba(255, 255, 255, 0.88);

    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
}


/* =========================
   LOGO
========================= */

.logo {
    flex-shrink: 0;

    color: #111;
    text-decoration: none;

    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1;

    white-space: nowrap;
}

.logo span {
    color: #e45b35;
    margin-left: 3px;
}


/* =========================
   NAVIGATION
========================= */

.main-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 2vw, 30px);

    flex: 1;
}

.main-nav a {
    position: relative;

    color: #222;
    text-decoration: none;

    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;

    padding: 8px 0;

    transition: color 0.25s ease;
}

.main-nav a::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: 2px;

    width: 0;
    height: 2px;

    background: #e45b35;
    border-radius: 10px;

    transition: width 0.25s ease;
}

.main-nav a:hover {
    color: #e45b35;
}

.main-nav a:hover::after {
    width: 100%;
}


/* =========================
   BUTTON
========================= */

.btn-small {
    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 44px;
    padding: 0 20px;

    color: #fff;
    background: #e45b35;

    border-radius: 12px;

    text-decoration: none;
    font-size: 14px;
    font-weight: 700;

    box-shadow: 0 6px 18px rgba(228, 91, 53, 0.25);

    transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.btn-small:hover {
    background: #cf4825;
    transform: translateY(-2px);
    box-shadow: 0 9px 24px rgba(228, 91, 53, 0.35);
}


/* =========================
   HAMBURGER
========================= */

.menu-toggle {
    display: none;

    width: 46px;
    height: 46px;

    flex-shrink: 0;

    padding: 0;

    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;

    border: 0;
    border-radius: 12px;

    background: rgba(0, 0, 0, 0.06);

    cursor: pointer;
}

.menu-toggle span {
    display: block;

    width: 21px;
    height: 2px;

    background: #222;
    border-radius: 10px;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

/* Hamburger → X */

.menu-toggle.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

.menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}


/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .header-inner {
        gap: 20px;
    }

    .main-nav {
        gap: 16px;
    }

    .main-nav a {
        font-size: 13px;
    }

    .btn-small {
        padding: 0 15px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .site-header {
        top: 12px;
        padding: 0 12px;
    }

    .header-inner {
        position: relative;

        min-height: 64px;

        padding: 9px 10px 9px 18px;

        border-radius: 16px;
    }

    .logo {
        font-size: 16px;
    }

    /* Hide desktop navigation */
    .main-nav {
        display: flex;

        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        right: 0;

        padding: 14px;

        flex-direction: column;
        align-items: stretch;
        gap: 3px;

        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 16px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);

        pointer-events: none;

        transition:
            opacity 0.25s ease,
            visibility 0.25s ease,
            transform 0.25s ease;
    }

    /* Open mobile menu */
    .main-nav.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        pointer-events: auto;
    }

    .main-nav a {
        display: block;

        padding: 13px 12px;

        border-radius: 9px;

        font-size: 14px;
    }

    .main-nav a:hover {
        background: rgba(228, 91, 53, 0.08);
    }

    .main-nav a::after {
        display: none;
    }

    /* Hide register button on mobile */
    .header-inner > .btn-small {
        display: none;
    }

    /* Show hamburger */
    .menu-toggle {
        display: flex;
        margin-left: auto;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .site-header {
        padding: 0 8px;
    }

    .header-inner {
        padding-left: 14px;
    }

    .logo {
        font-size: 14px;
        letter-spacing: 1px;
    }

    .menu-toggle {
        width: 42px;
        height: 42px;
    }
}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    .site-header,
    .header-inner,
    .main-nav,
    .main-nav a,
    .menu-toggle span,
    .btn-small {
        transition: none;
    }
}
</style>

<script>
const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");
const siteHeader = document.querySelector(".site-header");

menuToggle.addEventListener("click", () => {
    const isOpen = mainNav.classList.toggle("active");

    menuToggle.classList.toggle("active", isOpen);

    menuToggle.setAttribute("aria-expanded", isOpen);
    menuToggle.setAttribute(
        "aria-label",
        isOpen ? "Close navigation menu" : "Open navigation menu"
    );
});

/* Close menu after clicking a navigation link */
mainNav.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
        mainNav.classList.remove("active");
        menuToggle.classList.remove("active");

        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open navigation menu");
    });
});

/* Add stronger glass effect when scrolling */
window.addEventListener("scroll", () => {
    siteHeader.classList.toggle("scrolled", window.scrollY > 20);
});
</script>
