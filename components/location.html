<!-- LOCATION SECTION -->
<section class="location-section">

    <div class="container location-container">

        <div class="location-box">

            <div class="location-content">

                <p class="eyebrow">Location</p>

                <h3>Kings Institute, Nugegoda</h3>

                <p class="location-address">
                    <a
                        href="https://www.google.com/maps/search/?api=1&query=No.+239%2F2+High+Level+Road%2C+Nugegoda%2C+Sri+Lanka"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📍 View Location on Google Maps
                    </a>
                </p>

                <svg
                    class="location-map-icon"
                    viewBox="0 0 250 130"
                    role="img"
                    aria-label="Location map illustration"
                >

                    <image
                        href="images/i-gploc2.webp"
                        x="62"
                        y="10"
                        width="125"
                        height="110"
                        preserveAspectRatio="xMidYMid meet"
                    />

                    <!-- Clickable map pin -->
                    <a
                        href="https://www.google.com/maps/search/?api=1&query=No.+239%2F2+High+Level+Road%2C+Nugegoda%2C+Sri+Lanka"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <circle
                            cx="127"
                            cy="27"
                            r="10"
                            fill="transparent"
                            style="cursor: pointer;"
                        />

                        <circle
                            cx="127"
                            cy="27"
                            r="5"
                            class="map-pin-pulse"
                        />
                    </a>

                </svg>

            </div>

        </div>

    </div>

</section>
