<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
    }

    /* Floating Header */
    .floating-header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 1100px);
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);

      z-index: 1000;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    .logo svg {
      width: 36px;
      height: 36px;
    }

    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav a {
      color: #222;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: #635bff;
    }

    /* CTA */
    .header-btn {
      border: none;
      background: #111;
      color: #fff;
      padding: 11px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .header-btn:hover {
      background: #635bff;
      transform: translateY(-1px);
    }

    /* Mobile Button */
    .menu-toggle {
      display: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 5px;
    }

    .menu-toggle svg {
      width: 25px;
      height: 25px;
    }

    /* Mobile */
    @media (max-width: 700px) {

      .floating-header {
        top: 12px;
        width: calc(100% - 24px);
        padding: 10px 14px;
        border-radius: 20px;
        flex-wrap: wrap;
      }

      .nav {
        display: none;
        width: 100%;
        padding: 15px 5px 5px;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .nav.active {
        display: flex;
      }

      .header-btn {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .floating-header.menu-open {
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="floating-header" id="header">

    <!-- Logo -->
    <a href="#" class="logo">

      <!-- SVG Logo -->
      <svg viewBox="0 0 40 40" fill="none"
           xmlns="http://www.w3.org/2000/svg">

        <rect width="40" height="40" rx="12" fill="#635BFF"/>

        <path
          d="M11 20L17 14L23 20L29 14"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M11 26L17 20L23 26L29 20"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </svg>

      <span>Brand</span>
    </a>


    <!-- Navigation -->
    <nav class="nav" id="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>


    <!-- Desktop CTA -->
    <button class="header-btn">
      Get Started
    </button>


    <!-- Mobile Menu -->
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">

      <svg viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">

        <path
          d="M4 7H20"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M4 12H20"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M4 17H20"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

      </svg>

    </button>

  </header>


  <script>
    const menuToggle = document.getElementById("menuToggle");
    const nav = document.getElementById("nav");
    const header = document.getElementById("header");

    menuToggle.addEventListener("click", () => {
      nav.classList.toggle("active");
      header.classList.toggle("menu-open");
    });
  </script>

</body>
</html>
