<html>
<head>

  <link rel="stylesheet" href="animate.css">
</head>

<body>

    <!-- Main SVG illustration -->
    <svg class="hero-illustration" viewBox="0 0 500 500" role="img" aria-label="Illustration representing confident communication">
    
    <circle cx="250" cy="250" r="210" class="svg-bg-circle"/>
      
    <!-- Point 1 -->
    <g class="svg-point point-1">
        <text x="250" y="220" class="point-title">
            Public Speaking
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Build confidence, improve voice
            </tspan>
            <tspan x="250" dy="25">
                projection, body language and
            </tspan>
            <tspan x="250" dy="25">
                presentation skills.
            </tspan>
        </text>
    </g>

    <!-- Point 2 -->
    <g class="svg-point point-2">
        <text x="250" y="220" class="point-title">
            Creative Writing
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Develop imaginative ideas,
            </tspan>
            <tspan x="250" dy="25">
                create engaging stories and
            </tspan>
            <tspan x="250" dy="25">
                write with expression.
            </tspan>
        </text>
    </g>

    <!-- Point 3 -->
    <g class="svg-point point-3">
        <text x="250" y="220" class="point-title">
            Grammar
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Strengthen grammar, vocabulary
            </tspan>
            <tspan x="250" dy="25">
                and sentence construction for
            </tspan>
            <tspan x="250" dy="25">
                more accurate communication.
            </tspan>
        </text>
    </g>

    <!-- Point 4 -->
    <g class="svg-point point-4">
        <text x="250" y="220" class="point-title">
            Spoken English
        </text>

        <text x="250" y="255" class="point-content">
            <tspan x="250" dy="0">
                Improve speaking skills to
            </tspan>
            <tspan x="250" dy="25">
                communicate with greater
            </tspan>
            <tspan x="250" dy="25">
                confidence, ease and clarity.
            </tspan>
        </text>
    </g>                           
                            
    </svg>    
                          
  
</body>
</html>
